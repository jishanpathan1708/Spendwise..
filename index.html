<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Spendwise!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="logo">SpendWise.</div>
            <div class="profile" id="profileBtn">
    My Account 👤
</div>

<div id="accountMenu" class="account-menu">
    <h3>My Accounts</h3>

    <div id="accountList"></div>

    <button onclick="createAccount()">
        + Create New Account
    </button>
</div>
        </header>

        <section class="welcome">
            <h1 id="WelcomeTitle">Hello..! 👋</h1>
            <p>Here's your financial overview.</p>
        </section>

        <section class="summary">

            <div class="card balance">
                <p>Total Balance</p>
                <h2 id="balance">₹0</h2>
            </div>

            <div class="card income">
                <p>Total Income</p>
                <h2 id="income">₹0</h2>
            </div>

            <div class="card expense">
                <p>Total Expenses</p>
                <h2 id="expense">₹0</h2>
            </div>

        </section>

        <section class="transactions">

    <div class="section-heading">
        <h2>Recent Transactions</h2>

        <div class="action-buttons">
    <button id="incomeBtn">+ Add Income</button>
    <button id="addBtn">+ Add Expense</button>
    <button id="resetBtn">Reset All</button>
</div>
    </div>

    <form id="transactionForm" class="transaction-form" hidden>

        <h3 id="formTitle">Add Expense</h3>

        <label>Amount (₹)</label>
        <input type="number" id="amountInput"
               placeholder="Enter amount" min="0.01"
               step="0.01" required>

        <label>Category</label>
        <select id="categoryInput" required>
            <option value="">Select category</option>
            <option>Food</option>
            <option>Shopping</option>
            <option>Travel</option>
            <option>Bills</option>
            <option>Salary</option>
            <option>Pocket Money</option>
            <option>Business</option>
            <option>Other</option>
        </select>

        <label>Date</label>
        <input type="date" id="dateInput" required>

        <label>Description</label>
        <input type="text" id="descriptionInput"
               placeholder="What was this transaction for?">

        <div class="form-buttons">
            <button type="submit" id="saveBtn">Save Transaction</button>
            <button type="button" id="cancelBtn">Cancel</button>
        </div>

    </form>

    <div id="transactionList">
        <p class="empty">No transactions yet. Add your first transaction!</p>
    </div>

</section>

        </section>

        <footer>
            <p>© 2026 SpendWise. Manage your money wisely.</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
